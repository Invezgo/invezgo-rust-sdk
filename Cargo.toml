[package]
name = "invezgo-sdk"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Official fully-typed Rust SDK for the Invezgo API (Indonesia stock market data) with built-in LRU cache and API key rotation."
license = "MIT"
readme = "README.md"
repository = "https://github.com/invezgo/invezgo-sdk"
homepage = "https://invezgo.com"
documentation = "https://docs.rs/invezgo-sdk"
keywords = ["invezgo", "stock", "idx", "indonesia", "sdk"]
categories = ["api-bindings", "asynchronous", "finance"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
