[package]
name = "invezgo-sdk"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
description = "Official fully-typed Rust SDK for the Invezgo API (Indonesia stock market data) with built-in LRU cache and API key rotation."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Invezgo/invezgo-rust-sdk"
homepage = "https://invezgo.com"
documentation = "https://docs.rs/invezgo-sdk"
keywords = ["invezgo", "stock", "idx", "indonesia", "sdk"]
categories = ["api-bindings", "asynchronous", "finance"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"], optional = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }

[features]
default = []
## Webhook signature verification and payload parsing.
webhook = ["dep:hmac", "dep:sha2"]
## Real-time WebSocket client (`wss://api.invezgo.com/ws`).
websocket = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
